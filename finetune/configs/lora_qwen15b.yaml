# EligiTrace LoRA SFT config - strategy chosen from measured results/training/memory_bench.json
run_name: lora_r16_bf16
base_model: Qwen/Qwen2.5-1.5B-Instruct
seed: 42
max_seq_len: 1024          # longest example is 623 tokens -> 0 truncation (results/data/token_stats.json)
strategy: bf16-mixed       # fp32 | fp32-offload | fp16-mixed | bf16-mixed | qlora-nf4
grad_ckpt: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  epochs: 3
  lr: 2.0e-4
  warmup_ratio: 0.05
  micro_batch: 1            # mb>=4 OOMs on 6 GB (151k-vocab logits), see memory_bench.json
  grad_accum: 16           # effective batch 16
  weight_decay: 0.0
  max_grad_norm: 1.0
  log_every: 5
oversample: {}             # e.g. {"excluded": 3, "not included": 3}
eval_each_epoch: true      # generation-based val metrics per epoch (model selection)
