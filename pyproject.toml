[project]
name = "eligitrace"
version = "0.1.0"
description = "Evidence-traced clinical-trial eligibility screening with a fine-tuned open-weight Transformer"
readme = "README.md"
authors = [{ name = "Muhammad Ruhan Kamran", email = "ruhan.k.dev@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.51,<5",
    "accelerate>=1.3",
    "peft>=0.15",
    "datasets>=3.3",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "matplotlib>=3.10",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "httpx>=0.28",
    "bitsandbytes>=0.45",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["settings", "dataprep", "modeling", "finetune", "evaluation", "kvcache",
            "attention", "speculative", "server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B023", "B905", "E741"]  # lambdas run in-loop; l = paper notation

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU and downloaded models",
    "slow: long-running",
]
addopts = "-q"
